# Render Blueprint — see README "Deploy to Render".
services:
  - type: web
    name: tcgcopbot
    runtime: docker
    rootDir: tcgcopbot
    plan: starter          # needs a paid plan for the persistent disk
    region: singapore      # Render's closest region to Australia
    healthCheckPath: /healthz
    numInstances: 1        # one instance: the database is a single SQLite file
    disk:
      name: tcgcopbot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/tcgcopbot.db
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_ENCRYPTION_KEY
        generateValue: true   # back this up somewhere safe — without it, saved details can't be read
      - key: BASE_URL
        sync: false           # e.g. https://tcgcopbot.onrender.com or your own domain
      - key: ADMIN_EMAILS
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PRICE_DISPLAY
        value: A$19 / month
      - key: TRIAL_DAYS
        value: "7"
